[project]
name = "sg-notification-service"
version = "0.1.0"
description = "SG platform notification service: WhatsApp e-bills, promotional campaigns and OTPs behind a provider-neutral interface (SQS sender, campaign scheduler, provider webhooks; Python, AWS Lambda Powertools)"
requires-python = ">=3.13,<3.14"
dependencies = [
    "sg-commons",
    "aws-lambda-powertools>=3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "alembic>=1.13",
    "boto3>=1.34",
    "pyjwt[crypto]>=2.8",
    "cryptography>=42",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "testcontainers[postgres]>=4.5",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.uv.sources]
sg-commons = { path = "../sg-commons", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
plugins = ["pydantic.mypy"]
